[toolchain]
components = ["rustc", "cargo", "rust-std", "rustfmt", "clippy"]
profile = "default"

[anchor]
version = "0.32.1"
solana = "1.18.0"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[programs]
devnet = {}

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
